#:schema https://yazi-rs.github.io/schemas/yazi.json

# Overrides only. Yazi merges this file over its built-in preset:
# https://github.com/sxyazi/yazi/blob/v26.9.1/yazi-config/preset/yazi-default.toml

[preview]
# Room for images when toggle-pane maximizes the preview (T).
max_width  = 1000
max_height = 1000

[plugin]
# git.yazi: status signs in the file list.
prepend_fetchers = [
  { url = "*", run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
]
# piper.yazi: render Markdown with glow (cli packages).
prepend_previewers = [
  { url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
]
