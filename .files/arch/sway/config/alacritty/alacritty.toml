# Sway terminal face. The shared config still owns keybinds and opacity.
# Theme import stays inside that file. This file only replaces the family.
[general]
import = ["~/.system-bootstrap/.files/alacritty.toml"]

[font]
size = 14

[font.normal]
family = "RecMonoLinear Nerd Font Mono"
style = "Regular"

[font.bold]
family = "RecMonoLinear Nerd Font Mono"
style = "Bold"

[font.italic]
family = "RecMonoLinear Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "RecMonoLinear Nerd Font Mono"
style = "Bold Italic"
