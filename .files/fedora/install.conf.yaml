- defaults:
    link:
      relink: true
      create: true
      force: true
- clean: ["~"]

- clean:
    ~/.config:
      recursive: true
- link:
    ~/system-update.sh: ./fedora-system-update.sh

- shell:
    - for i in 1 2 3 4 5 6 7 8 9; do gsettings list-schemas | grep -qx org.gnome.shell.keybindings && gsettings set org.gnome.shell.keybindings switch-to-application-$i "[]" || true; done
    - for i in 1 2 3 4 5 6 7 8 9; do gsettings list-schemas | grep -qx org.gnome.desktop.wm.keybindings && gsettings set org.gnome.desktop.wm.keybindings switch-to-workspace-$i "['<Super>$i']" || true; done
    - for i in 1 2 3 4 5 6 7 8 9; do gsettings list-schemas | grep -qx org.gnome.desktop.wm.keybindings && gsettings set org.gnome.desktop.wm.keybindings move-to-workspace-$i "['<Super><Shift>$i']" || true; done
    - gsettings list-schemas | grep -qx org.gnome.mutter && gsettings set org.gnome.mutter dynamic-workspaces false || true
    - gsettings list-schemas | grep -qx org.gnome.desktop.wm.preferences && gsettings set org.gnome.desktop.wm.preferences num-workspaces 9 || true
    - gsettings list-schemas | grep -qx org.gnome.shell.keybindings && gsettings set org.gnome.shell.keybindings show-screenshot-ui "['<Super>Print', 'Print']" || true
