# niri + DankMaterialShell.
#
# Only the hand-edited files are linked. Everything DMS generates from
# DankMaterialShell/settings.json is deliberately left out — it is rebuilt on the
# next DMS start:
#   ~/.config/niri/dms/{colors,layout,alttab,input,cursor,outputs,windowrules,wpblur}.kdl
#       every one is marked "! AUTO-GENERATED BY DMS !" or is an empty placeholder;
#       dms/binds.kdl carries no such banner, so it is the only linked file there.
#   ~/.config/alacritty/dank-theme.toml     ~/.config/kitty/dank-{theme,tabs}.conf
#   ~/.config/gtk-{3.0,4.0}/dank-colors.css ~/.config/qt{5,6}ct/colors/matugen.conf
#   ~/.config/dgop/colors.json              ~/.config/ghostty/themes/dankcolors
#   ~/.config/DankMaterialShell/{firefox,zen}.css
#   ~/.local/share/color-schemes/DankMatugen*.colors
#
# Per-machine runtime state is out of scope too: ~/.local/state/DankMaterialShell/
# holds the wallpaper path, weather location, and launcher history.
#
# DMS saves settings.json with an atomic write (temp file + rename). Qt's QSaveFile
# resolves the symlink and writes through to the target, so the link survives and
# every change made in the DMS UI lands straight in this repo — verified on 2026-09-06.
- defaults:
    link:
      relink: true
      create: true
      force: true

- link:
    ~/.config/niri/config.kdl: .config/niri/config.kdl
    ~/.config/niri/dms/binds.kdl: .config/niri/dms/binds.kdl
    ~/.config/DankMaterialShell/settings.json: .config/DankMaterialShell/settings.json
    ~/.config/danksearch/config.toml: .config/danksearch/config.toml
    ~/.config/environment.d/90-dms.conf: .config/environment.d/90-dms.conf
    ~/.config/mimeapps.list: .config/mimeapps.list
    ~/.config/xdg-terminals.list: .config/xdg-terminals.list
