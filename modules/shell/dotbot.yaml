# Applied with the repo root as base dir (scripts/host.sh).
- defaults:
    link:
      relink: true
      create: true
      force: true

- link:
    ~/.config/zsh/zshrc: modules/shell/files/zshrc
    ~/.tmux.conf: modules/shell/files/tmux.conf
    ~/.config/starship.toml: modules/shell/files/starship.toml
    ~/.config/zellij/config.kdl: modules/shell/files/zellij/config.kdl
    ~/.config/zellij/layouts/default.kdl: modules/shell/files/zellij/layouts/default.kdl
    ~/.config/zellij/layouts/editor.kdl: modules/shell/files/zellij/layouts/editor.kdl
    ~/.config/zellij/layouts/media.kdl: modules/shell/files/zellij/layouts/media.kdl
