apiVersion: binstaller.io/v1alpha1
kind: BinaryDistributionProfile
metadata:
  name: developer-binaries
  labels:
    platform: linux-amd64
    source: system-bootstrap
spec:
  policy:
    mode: developer
    appsDir: ${HOME}/.apps
    continueOnError: true
    allowSudoSymlinks: true

  # Every tool is pinned. Renovate bumps each version through its `# renovate:`
  # comment (see renovate.json). A tool with a static `checksum.value` needs that
  # value refreshed in the same PR; a stale value makes apply fail on mismatch.
  versions:
    # renovate: datasource=github-releases depName=sxyazi/yazi
    yazi: v26.9.1
    # renovate: datasource=github-tags depName=ziglang/zig
    zig: "0.15.2"
    # renovate: datasource=github-releases depName=kubernetes-sigs/kind
    kind: v0.31.0
    # renovate: datasource=github-releases depName=zellij-org/zellij
    zellij: v0.44.1
    # renovate: datasource=github-releases depName=jj-vcs/jj
    jujutsu: v0.40.0
    # No renovate comment: scripts/lib/dotbot.sh pins the same release with its
    # SHA-256. Bump both by hand.
    dotbot: v0.4.2
    # renovate: datasource=github-releases depName=jesseduffield/lazygit extractVersion=^v(?<version>.+)$
    lazygit: "0.66.3"
    # renovate: datasource=github-releases depName=worxbend/swaylingo-c
    skbd: v0.4.1
    # renovate: datasource=github-releases depName=worxbend/airgradient-cli
    airgradient-cli: v0.6.0
    # renovate: datasource=github-releases depName=kubernetes/kubernetes
    kubectl: v1.37.2
    # renovate: datasource=github-releases depName=kubernetes/minikube
    minikube: v1.39.0
    # renovate: datasource=github-releases depName=sayanarijit/xplr
    xplr: v1.2.2
    # renovate: datasource=github-releases depName=neovim/neovim
    neovim: v0.12.6
    # renovate: datasource=github-releases depName=neovide/neovide
    neovide: "0.17.2"
    # renovate: datasource=github-releases depName=helm/helm
    helm: v4.3.2
    # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize extractVersion=^kustomize/v(?<version>.+)$
    kustomize: "5.8.3"
    # renovate: datasource=github-releases depName=mikefarah/yq
    yq: v4.54.3
    # renovate: datasource=github-releases depName=worxbend/nerd-fonts-installer
    nerd-fonts-installer: v1.0.9

    # Own tools (github.com/worxbend) with GitHub releases.
    # renovate: datasource=github-releases depName=worxbend/obsctl
    obsctl: v1.0.2
    # renovate: datasource=github-releases depName=worxbend/obsctl-rs
    obsctl-rs: v0.9.1
    # renovate: datasource=github-releases depName=worxbend/obs-stats
    obs-stats: v0.6.0
    # renovate: datasource=github-releases depName=worxbend/twi
    twi: v0.19.0
    # renovate: datasource=github-releases depName=worxbend/airgradient-tui-scala extractVersion=^v(?<version>.+)$
    airgradient-tui: "0.2.2"
    # renovate: datasource=github-releases depName=worxbend/swaylingo
    skbd-rs: v0.4.0

  plan:
    - name: yazi
      kind: binary-tool
      description: Blazing fast terminal file manager
      spec:
        versionRef: yazi
        installDir: ${appsDir}/yazi
        download:
          url: https://github.com/sxyazi/yazi/releases/download/${version}/yazi-x86_64-unknown-linux-gnu.zip
          filename: yazi.zip
          checksum:
            algorithm: sha256
            value: a02fe91d3304294048c681f010f1100856872a4e98ecf6927328e888d40a6ad2
          archive:
            type: zip
            extract:
              directories:
                - from: yazi-x86_64-unknown-linux-gnu
                  to: bin
        executables:
          - path: bin/yazi
            mode: "0755"
          - path: bin/ya
            mode: "0755"

    - name: zig
      kind: binary-tool
      description: Zig compiler toolchain
      spec:
        versionRef: zig
        installDir: ${appsDir}/zig
        download:
          url: https://ziglang.org/download/${version}/zig-x86_64-linux-${version}.tar.xz
          filename: zig.tar.xz
          checksum:
            algorithm: sha256
            value: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
          archive:
            type: tar.xz
            extract:
              directories:
                - from: zig-x86_64-linux-${version}
                  to: .
        executables:
          - path: zig
            mode: "0755"
        symlinks:
          - path: bin/zig
            target: ${installDir}/zig

    - name: minikube
      kind: binary-tool
      description: Local Kubernetes cluster
      spec:
        versionRef: minikube
        installDir: ${appsDir}/minikube/bin
        download:
          url: https://github.com/kubernetes/minikube/releases/download/${version}/minikube-linux-amd64
          filename: minikube
          checksum:
            algorithm: sha256
            value: b738496da01be06bbaf80c688f57ce25acd3849fbb518155f3a88e03ef555aa4
        executables:
          - path: minikube
            mode: "0755"

    - name: xplr
      kind: binary-tool
      description: Hackable terminal file explorer
      spec:
        versionRef: xplr
        installDir: ${appsDir}/xplr
        download:
          url: https://github.com/sayanarijit/xplr/releases/download/${version}/xplr-linux.tar.gz
          filename: xplr.tar.gz
          checksum:
            algorithm: sha256
            discover:
              type: sha256sum
              url: https://github.com/sayanarijit/xplr/releases/download/${version}/xplr-linux.sha256
              file: xplr-linux.tar.gz
          archive:
            type: tar.gz
            extract:
              files:
                - from: xplr
                  to: bin/xplr
        executables:
          - path: bin/xplr
            mode: "0755"

    - name: kind
      kind: binary-tool
      description: Kubernetes in Docker
      spec:
        versionRef: kind
        installDir: ${appsDir}/kind/bin
        download:
          url: https://kind.sigs.k8s.io/dl/${version}/kind-linux-amd64
          filename: kind
          checksum:
            algorithm: sha256
            discover:
              type: sha256sum
              url: https://github.com/kubernetes-sigs/kind/releases/download/${version}/kind-linux-amd64.sha256sum
              file: kind-linux-amd64
        executables:
          - path: kind
            mode: "0755"

    - name: zellij
      kind: binary-tool
      description: Terminal workspace multiplexer
      spec:
        versionRef: zellij
        installDir: ${appsDir}/zellij
        download:
          url: https://github.com/zellij-org/zellij/releases/download/${version}/zellij-x86_64-unknown-linux-musl.tar.gz
          filename: zellij.tar.gz
          # Static: upstream's .sha256sum hashes the extracted binary, not the tarball.
          checksum:
            algorithm: sha256
            value: 669825021d529fca5d939888263c9d2a90762145191fa07581a15250e8af2b49
          archive:
            type: tar.gz
            extract:
              files:
                - from: zellij
                  to: bin/zellij
        executables:
          - path: bin/zellij
            mode: "0755"

    - name: kubectl
      kind: binary-tool
      description: Kubernetes command-line tool
      spec:
        versionRef: kubectl
        installDir: ${appsDir}/kubectl/bin
        download:
          url: https://dl.k8s.io/release/${version}/bin/linux/amd64/kubectl
          filename: kubectl
          checksum:
            algorithm: sha256
            value: c04487523e7aa7d1493f7808174c899db93d7a9cf57531420cd76b9bd415f8f4
        executables:
          - path: kubectl
            mode: "0755"

    - name: neovide
      kind: binary-tool
      description: No-nonsense Neovim GUI
      spec:
        versionRef: neovide
        installDir: ${appsDir}/neovide/bin
        download:
          url: https://github.com/neovide/neovide/releases/download/${version}/neovide.AppImage
          filename: neovide
          checksum:
            algorithm: sha256
            value: 99f9b9ffd74d4d20bbb86ea1aaaf46eb2b6617a7193a0f719f046568034d9772
        executables:
          - path: neovide
            mode: "0755"

    - name: neovim
      kind: binary-tool
      description: Hyperextensible Vim-based text editor
      spec:
        versionRef: neovim
        installDir: ${appsDir}/neovim
        download:
          url: https://github.com/neovim/neovim/releases/download/${version}/nvim-linux-x86_64.tar.gz
          filename: neovim.tar.gz
          checksum:
            algorithm: sha256
            value: 474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87
          archive:
            type: tar.gz
            extract:
              directories:
                - from: nvim-linux-x86_64
                  to: .
        executables:
          - path: bin/nvim
            mode: "0755"
        symlinks:
          - path: bin/neovim
            target: ${installDir}/bin/nvim
          - path: bin/vim
            target: ${installDir}/bin/nvim
          - path: /usr/local/bin/nvim
            target: ${installDir}/bin/nvim
            sudo: true
          - path: /usr/local/bin/neovim
            target: ${installDir}/bin/nvim
            sudo: true
          - path: /usr/local/bin/vim
            target: ${installDir}/bin/nvim
            sudo: true

    - name: lazygit
      kind: binary-tool
      description: Terminal UI for git
      spec:
        versionRef: lazygit
        installDir: ${appsDir}/lazygit
        download:
          url: https://github.com/jesseduffield/lazygit/releases/download/v${version}/lazygit_${version}_linux_x86_64.tar.gz
          filename: lazygit.tar.gz
          checksum:
            algorithm: sha256
            discover:
              type: sha256sum
              url: https://github.com/jesseduffield/lazygit/releases/download/v${version}/checksums.txt
              file: lazygit_${version}_linux_x86_64.tar.gz
          archive:
            type: tar.gz
            extract:
              files:
                - from: lazygit
                  to: bin/lazygit
        executables:
          - path: bin/lazygit
            mode: "0755"
        symlinks:
          - path: bin/lzg
            target: ${installDir}/bin/lazygit

    - name: jujutsu
      kind: binary-tool
      description: Git-compatible VCS
      spec:
        versionRef: jujutsu
        installDir: ${appsDir}/jujutsu
        download:
          url: https://github.com/jj-vcs/jj/releases/download/${version}/jj-${version}-x86_64-unknown-linux-musl.tar.gz
          filename: jj.tar.gz
          checksum:
            algorithm: sha256
            value: 5c8979f46873e052f59bdd9535636dca6e6f9f70571b73f6d63c3b92acfaa037
          archive:
            type: tar.gz
            extract:
              files:
                - from: jj
                  to: bin/jj
        executables:
          - path: bin/jj
            mode: "0755"
        symlinks:
          - path: bin/jj-scm
            target: ${installDir}/bin/jj
          - path: bin/jujutsu
            target: ${installDir}/bin/jj

    - name: dotbot
      kind: binary-tool
      description: Dotfiles bootstrapper (dotbot-go)
      spec:
        versionRef: dotbot
        installDir: ${appsDir}/dotbot
        download:
          url: https://github.com/worxbend/dotbot-go/releases/download/${version}/dotbot-linux-amd64.tar.gz
          filename: dotbot.tar.gz
          checksum:
            algorithm: sha256
            discover:
              type: sha256sum
              url: https://github.com/worxbend/dotbot-go/releases/download/${version}/dotbot-linux-amd64.tar.gz.sha256
              file: dist/dotbot-linux-amd64.tar.gz
          archive:
            type: tar.gz
            extract:
              files:
                - from: dotbot
                  to: bin/dotbot
        executables:
          - path: bin/dotbot
            mode: "0755"

    - name: skbd
      kind: binary-tool
      description: Per-window keyboard layout daemon for Sway (worxbend/swaylingo-c)
      spec:
        versionRef: skbd
        installDir: ${appsDir}/skbd/bin
        download:
          url: https://github.com/worxbend/swaylingo-c/releases/download/${version}/skbd-linux-amd64
          filename: skbd
          checksum:
            algorithm: sha256
            discover:
              type: sha256sum
              url: https://github.com/worxbend/swaylingo-c/releases/download/${version}/SHA256SUMS
              file: skbd-linux-amd64
        executables:
          - path: skbd
            mode: "0755"

    - name: airgradient-cli
      kind: binary-tool
      description: AirGradient LAN monitor CLI with Waybar output
      spec:
        versionRef: airgradient-cli
        installDir: ${appsDir}/airgradient-cli
        download:
          url: https://github.com/worxbend/airgradient-cli/releases/download/${version}/airgradient-cli-${version}-linux-amd64.tar.gz
          filename: airgradient-cli.tar.gz
          checksum:
            algorithm: sha256
            discover:
              type: sha256sum
              url: https://github.com/worxbend/airgradient-cli/releases/download/${version}/SHA256SUMS
              file: ./airgradient-cli-${version}-linux-amd64.tar.gz
          archive:
            type: tar.gz
            extract:
              files:
                - from: airgradient-cli
                  to: bin/airgradient-cli
        executables:
          - path: bin/airgradient-cli
            mode: "0755"

    - name: helm
      kind: binary-tool
      description: Kubernetes package manager
      spec:
        versionRef: helm
        installDir: ${appsDir}/helm
        download:
          url: https://get.helm.sh/helm-${version}-linux-amd64.tar.gz
          filename: helm.tar.gz
          checksum:
            algorithm: sha256
            discover:
              type: sha256sum
              url: https://get.helm.sh/helm-${version}-linux-amd64.tar.gz.sha256sum
              file: helm-${version}-linux-amd64.tar.gz
          archive:
            type: tar.gz
            extract:
              files:
                - from: linux-amd64/helm
                  to: bin/helm
        executables:
          - path: bin/helm
            mode: "0755"

    - name: kustomize
      kind: binary-tool
      description: Kubernetes manifest customization
      spec:
        versionRef: kustomize
        installDir: ${appsDir}/kustomize
        download:
          url: https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${version}/kustomize_v${version}_linux_amd64.tar.gz
          filename: kustomize.tar.gz
          checksum:
            algorithm: sha256
            discover:
              type: sha256sum
              url: https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${version}/checksums.txt
              file: kustomize_v${version}_linux_amd64.tar.gz
          archive:
            type: tar.gz
            extract:
              files:
                - from: kustomize
                  to: bin/kustomize
        executables:
          - path: bin/kustomize
            mode: "0755"

    - name: yq
      kind: binary-tool
      description: YAML/JSON/TOML processor (mikefarah/yq)
      spec:
        versionRef: yq
        installDir: ${appsDir}/yq/bin
        download:
          url: https://github.com/mikefarah/yq/releases/download/${version}/yq_linux_amd64
          filename: yq
          # Static: upstream's checksums file lists many hash types per line.
          checksum:
            algorithm: sha256
            value: 129534601871538efe0ba4c5e62a34fb1d5f469bcb975c4fddeb467d82974973
        executables:
          - path: yq
            mode: "0755"

    - name: nerd-fonts-installer
      kind: binary-tool
      description: Nerd Fonts installer (worxbend/nerd-fonts-installer)
      spec:
        versionRef: nerd-fonts-installer
        installDir: ${appsDir}/nerd-fonts-installer
        download:
          url: https://github.com/worxbend/nerd-fonts-installer/releases/download/${version}/nerd-fonts-installer_${version}_linux_amd64.tar.gz
          filename: nerd-fonts-installer.tar.gz
          checksum:
            algorithm: sha256
            discover:
              type: sha256sum
              url: https://github.com/worxbend/nerd-fonts-installer/releases/download/${version}/checksums.txt
              file: ./nerd-fonts-installer_${version}_linux_amd64.tar.gz
          archive:
            type: tar.gz
            extract:
              files:
                - from: nerd-fonts-installer_${version}_linux_amd64/nerd-fonts-installer
                  to: bin/nerd-fonts-installer
        executables:
          - path: bin/nerd-fonts-installer
            mode: "0755"

    # Own tools (github.com/worxbend) with GitHub releases.
    - name: obsctl
      kind: binary-tool
      description: OBS Studio CLI/TUI over obs-websocket 5 (Crystal)
      spec:
        versionRef: obsctl
        installDir: ${appsDir}/obsctl
        download:
          url: https://github.com/worxbend/obsctl/releases/download/${version}/obsctl-${version}-linux-amd64.tar.gz
          filename: obsctl.tar.gz
          checksum:
            algorithm: sha256
            discover:
              type: sha256sum
              url: https://github.com/worxbend/obsctl/releases/download/${version}/SHA256SUMS.txt
              file: obsctl-${version}-linux-amd64.tar.gz
          archive:
            type: tar.gz
            extract:
              files:
                - from: obsctl
                  to: bin/obsctl
        executables:
          - path: bin/obsctl
            mode: "0755"

    - name: obsctl-rs
      kind: binary-tool
      description: OBS Studio controller TUI (Rust); renamed to avoid the obsctl clash
      spec:
        versionRef: obsctl-rs
        installDir: ${appsDir}/obsctl-rs
        download:
          url: https://github.com/worxbend/obsctl-rs/releases/download/${version}/obsctl-${version}-linux-amd64.tar.gz
          filename: obsctl-rs.tar.gz
          checksum:
            algorithm: sha256
            discover:
              type: sha256sum
              url: https://github.com/worxbend/obsctl-rs/releases/download/${version}/obsctl-${version}-linux-amd64.tar.gz.sha256
              file: obsctl-${version}-linux-amd64.tar.gz
          archive:
            type: tar.gz
            extract:
              files:
                - from: obsctl
                  to: bin/obsctl-rs
        executables:
          - path: bin/obsctl-rs
            mode: "0755"

    - name: obs-stats
      kind: binary-tool
      description: btop-style OBS Studio dashboard
      spec:
        versionRef: obs-stats
        installDir: ${appsDir}/obs-stats
        download:
          url: https://github.com/worxbend/obs-stats/releases/download/${version}/obs-stats-${version}-x86_64-unknown-linux-musl.tar.gz
          filename: obs-stats.tar.gz
          checksum:
            algorithm: sha256
            discover:
              type: sha256sum
              url: https://github.com/worxbend/obs-stats/releases/download/${version}/SHA256SUMS
              file: obs-stats-${version}-x86_64-unknown-linux-musl.tar.gz
          archive:
            type: tar.gz
            extract:
              files:
                - from: obs-stats-${version}-x86_64-unknown-linux-musl/obs-stats
                  to: bin/obs-stats
        executables:
          - path: bin/obs-stats
            mode: "0755"

    - name: twi
      kind: binary-tool
      description: Twitch chat client for the terminal
      spec:
        versionRef: twi
        installDir: ${appsDir}/twi/bin
        download:
          url: https://github.com/worxbend/twi/releases/download/${version}/twi_linux_amd64
          filename: twi
          checksum:
            algorithm: sha256
            discover:
              type: sha256sum
              url: https://github.com/worxbend/twi/releases/download/${version}/SHA256SUMS
              file: twi_linux_amd64
        executables:
          - path: twi
            mode: "0755"

    - name: airgradient-tui
      kind: binary-tool
      description: AirGradient LAN dashboard TUI (Scala native)
      spec:
        versionRef: airgradient-tui
        installDir: ${appsDir}/airgradient-tui
        download:
          url: https://github.com/worxbend/airgradient-tui-scala/releases/download/v${version}/airgradient-tui-scala-${version}-linux-amd64.tar.gz
          filename: airgradient-tui.tar.gz
          checksum:
            algorithm: sha256
            discover:
              type: sha256sum
              url: https://github.com/worxbend/airgradient-tui-scala/releases/download/v${version}/SHA256SUMS
              file: airgradient-tui-scala-${version}-linux-amd64.tar.gz
          archive:
            type: tar.gz
            extract:
              files:
                - from: airgradient-tui
                  to: bin/airgradient-tui
        executables:
          - path: bin/airgradient-tui
            mode: "0755"

    - name: skbd-rs
      kind: binary-tool
      description: Per-window Sway keyboard layout (Rust); renamed to avoid the skbd (C) clash
      spec:
        versionRef: skbd-rs
        installDir: ${appsDir}/skbd-rs/bin
        download:
          url: https://github.com/worxbend/swaylingo/releases/download/${version}/skbd-linux-amd64
          filename: skbd-rs
          checksum:
            algorithm: sha256
            discover:
              type: sha256sum
              url: https://github.com/worxbend/swaylingo/releases/download/${version}/SHA256SUMS
              file: skbd-linux-amd64
        executables:
          - path: skbd-rs
            mode: "0755"
