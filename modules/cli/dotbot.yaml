# Applied with the repo root as base dir (scripts/host.sh).
- defaults:
    link:
      relink: true
      create: true
      force: true

- link:
    ~/.ideavimrc: modules/cli/files/ideavimrc
    ~/.config/nvim: modules/cli/files/nvim
    ~/.config/btop: modules/cli/files/btop
    ~/.config/lazygit/config.yml: modules/cli/files/lazygit/config.yml
    ~/.config/lsd/config.yaml: modules/cli/files/lsd/config.yaml
    ~/.config/lsd/colors.yaml: modules/cli/files/lsd/colors.yaml
    ~/.config/yazi/yazi.toml: modules/cli/files/yazi/yazi.toml
    ~/.config/yazi/theme.toml: modules/cli/files/yazi/theme.toml
    ~/.config/yazi/keymap.toml: modules/cli/files/yazi/keymap.toml
    ~/.config/binstaller/config.yaml: modules/cli/files/binstaller/config.yaml
