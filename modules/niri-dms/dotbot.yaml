# Applied with the repo root as base dir (scripts/host.sh).
# DMS writes through these links (Qt QSaveFile follows symlink chains), so its
# settings land in modules/niri-dms/files.
- defaults:
    link:
      relink: true
      create: true
      force: true

- link:
    ~/.config/niri/config.kdl: modules/niri-dms/files/niri/config.kdl
    ~/.config/niri/dms/binds.kdl: modules/niri-dms/files/niri/dms/binds.kdl
    ~/.config/niri/dms/windowrules.kdl: modules/niri-dms/files/niri/dms/windowrules.kdl
    ~/.config/dms/settings.json: modules/niri-dms/files/dms/settings.json
    ~/.config/dms/plugin_settings.json: modules/niri-dms/files/dms/plugin_settings.json
    ~/.config/dms/clsettings.json: modules/niri-dms/files/dms/clsettings.json
    ~/.config/danksearch/config.toml: modules/niri-dms/files/danksearch/config.toml
    ~/.config/environment.d/90-dms.conf: modules/niri-dms/files/environment.d/90-dms.conf
    ~/.config/mimeapps.list: modules/niri-dms/files/mimeapps.list
    ~/.config/xdg-terminals.list: modules/niri-dms/files/xdg-terminals.list
