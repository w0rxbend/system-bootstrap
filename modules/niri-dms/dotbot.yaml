# Applied with the repo root as base dir (scripts/host.sh).
# DMS writes through these links, so the sources stay at their .files paths.
- defaults:
    link:
      relink: true
      create: true
      force: true

- link:
    ~/.config/niri/config.kdl: .files/.config/niri/config.kdl
    ~/.config/niri/dms/binds.kdl: .files/.config/niri/dms/binds.kdl
    ~/.config/niri/dms/windowrules.kdl: .files/.config/niri/dms/windowrules.kdl
    ~/.config/dms/settings.json: .files/.config/dms/settings.json
    ~/.config/dms/plugin_settings.json: .files/.config/dms/plugin_settings.json
    ~/.config/dms/clsettings.json: .files/.config/dms/clsettings.json
    ~/.config/danksearch/config.toml: .files/.config/danksearch/config.toml
    ~/.config/environment.d/90-dms.conf: .files/.config/environment.d/90-dms.conf
    ~/.config/mimeapps.list: .files/.config/mimeapps.list
    ~/.config/xdg-terminals.list: .files/.config/xdg-terminals.list
