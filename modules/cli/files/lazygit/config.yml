# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/v0.66.3/schema/config.json
#
# lazygit config for v0.66.3. Only settings that differ from the defaults live here.
# Defaults: https://github.com/jesseduffield/lazygit/blob/v0.66.3/docs/Config.md

gui:
  # Catppuccin Mocha, peach accent: catppuccin/lazygit v2.3.1, themes-mergable/mocha/peach.yml.
  theme:
    activeBorderColor:
      - "#fab387" # peach
      - bold
    inactiveBorderColor:
      - "#a6adc8" # subtext0
    searchingActiveBorderColor:
      - "#f9e2af" # yellow
    optionsTextColor:
      - "#89b4fa" # blue
    selectedLineBgColor:
      - "#313244" # surface0
    inactiveViewSelectedLineBgColor:
      - "#6c7086" # overlay0
    cherryPickedCommitFgColor:
      - "#fab387" # peach
    cherryPickedCommitBgColor:
      - "#45475a" # surface1
    markedBaseCommitFgColor:
      - "#89b4fa" # blue
    markedBaseCommitBgColor:
      - "#f9e2af" # yellow
    unstagedChangesColor:
      - "#f38ba8" # red
    defaultFgColor:
      - "#cdd6f4" # text
    authorColors:
      "*": "#b4befe" # lavender

  nerdFontsVersion: "3"
  # Accordion: the focused side panel gets twice the height.
  expandFocusedSidePanel: true
  showNumstatInFilesView: true
  showDivergenceFromBaseBranch: arrowAndNumber
  showRandomTip: false
  filterMode: fuzzy

git:
  # Cycle renderers with `|`. delta 0.20+ speaks OSC 1717, so hunk staging works on its output.
  # Styles follow catppuccin/delta (catppuccin-mocha); "Catppuccin Mocha" ships with delta's bat 0.26.
  # Side by side only when the main view is wider than 160 columns (e.g. after `+`).
  diffRenderers:
    - name: delta
      command: >-
        delta --dark --paging=never --line-numbers
        --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
        {{if gt .width 160}}--side-by-side{{end}}
        --syntax-theme="Catppuccin Mocha"
        --file-style="#cdd6f4" --file-decoration-style="#6c7086"
        --hunk-header-style="file line-number syntax" --hunk-header-file-style=bold
        --hunk-header-line-number-style="bold #a6adc8" --hunk-header-decoration-style="#6c7086 box ul"
        --line-numbers-left-style="#6c7086" --line-numbers-right-style="#6c7086"
        --line-numbers-zero-style="#6c7086" --line-numbers-minus-style="bold #f38ba8"
        --line-numbers-plus-style="bold #a6e3a1"
        --minus-style="syntax #493447" --minus-emph-style="bold syntax #694559"
        --plus-style="syntax #394545" --plus-emph-style="bold syntax #4e6356"
    - name: git
      type: rawGit

# binstaller pins lazygit; a self-update would replace the pinned binary.
update:
  method: never

os:
  # Like `nvim`, but inside a Neovim terminal it opens the file in the parent Neovim.
  editPreset: nvim-remote
