# Dux dark purple. Both themes are the same. ANSI green and yellow are the
# secondary and surface text, so diffs stay readable on the purple surface.
font=RecMonoLinear Nerd Font Mono:size=16
pad=12x12
initial-color-theme=dark

[cursor]
style=block
blink=no
unfocused-style=hollow

