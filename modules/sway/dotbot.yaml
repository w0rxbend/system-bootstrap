# Applied with the repo root as base dir (scripts/host.sh).
# The desktop module owns alacritty.toml and theme.toml; sway adds wm.toml.
- defaults:
    link:
      relink: true
      create: true
      force: true

- link:
    ~/.config/sway/config: modules/sway/files/sway/config
    ~/.config/sway/scripts: modules/sway/files/sway/scripts
    ~/.config/swaylingo/config.toml: modules/sway/files/swaylingo/config.toml
    ~/Pictures/walls: assets/wallpapers
    ~/.config/wpaperd/config.toml: modules/sway/files/wpaperd/config.toml
    ~/.config/waybar/config.jsonc: modules/sway/files/waybar/config.jsonc
    ~/.config/waybar/style.css: modules/sway/files/waybar/style.css
    ~/.config/alacritty/wm.toml: modules/sway/files/alacritty/wm.toml
    ~/.config/fuzzel/fuzzel.ini: modules/sway/files/fuzzel/fuzzel.ini
    ~/.config/mako/config: modules/sway/files/mako/config
    ~/.config/foot/foot.ini: modules/sway/files/foot/foot.ini
    ~/.config/swaynag/config: modules/sway/files/swaynag/config
    ~/.config/wlsunset/config: modules/sway/files/wlsunset/config
    ~/.config/wob/wob.ini: modules/sway/files/wob/wob.ini
    ~/.config/systemd/user/skbd.service: modules/sway/files/systemd/skbd.service
