#:schema https://yazi-rs.github.io/schemas/keymap.json

# Overrides only. prepend_keymap wins over the built-in preset:
# https://github.com/sxyazi/yazi/blob/v26.9.1/yazi-config/preset/keymap-default.toml

[mgr]
prepend_keymap = [
  # Plugins (package.toml)
  { on = "l", run = "plugin smart-enter", desc = "Enter the child directory, or open the file" },
  { on = "f", run = "plugin jump-to-char", desc = "Jump to char" },
  { on = "F", run = "plugin smart-filter", desc = "Smart filter" },
  { on = "T", run = "plugin toggle-pane max-preview", desc = "Maximize or restore the preview pane" },
  { on = "<C-t>", run = "plugin toggle-pane min-preview", desc = "Show or hide the preview pane" },
  { on = ["c", "m"], run = "plugin chmod", desc = "Chmod on selected files" },
  { on = "M", run = "plugin mount", desc = "Mount, unmount or eject a disk" },
  { on = "<A-d>", run = "plugin diff", desc = "Diff the selected with the hovered file" },

  # Shell
  { on = "!", run = 'shell "$SHELL" --block', desc = "Open $SHELL here" },
  { on = ["g", "r"], run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"', desc = "Go to the Git root" },
]
