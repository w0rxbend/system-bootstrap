#:schema https://yazi-rs.github.io/schemas/theme.json

# Catppuccin Mocha flavor (package.toml, installed by `ya pkg install`).
# Overrides below keep the peach accent and rounded status bar of the old theme.

[flavor]
dark  = "catppuccin-mocha"
light = "catppuccin-mocha"

[mgr]
marker_selected = { fg = "#fab387", bg = "#fab387" }
count_selected  = { fg = "#1e1e2e", bg = "#fab387" }

[tabs]
active   = { fg = "#1e1e2e", bg = "#cdd6f4", bold = true }
inactive = { fg = "#cdd6f4", bg = "#45475a" }

[mode]
normal_main = { fg = "#1e1e2e", bg = "#fab387", bold = true }
normal_alt  = { fg = "#fab387", bg = "#313244" }

[indicator]
current = { fg = "#1e1e2e", bg = "#fab387" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

[which]
border = { fg = "#fab387" }

[confirm]
border = { fg = "#fab387" }
title  = { fg = "#fab387" }

[spot]
border = { fg = "#fab387" }
title  = { fg = "#fab387" }

[pick]
border = { fg = "#fab387" }

[input]
border = { fg = "#fab387" }

[cmp]
border = { fg = "#fab387" }

[tasks]
border = { fg = "#fab387" }
