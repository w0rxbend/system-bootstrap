# kitty 0.50: Dux face (DankMaterialShell, Material 3 dark purple).
# Zellij runs inside every window (WITH_ZELLIJ, see zshrc), so kitty keeps to
# ctrl+shift (kitty_mod) keys and leaves Ctrl b, Ctrl g and Alt-* to Zellij.

# --- Wayland ------------------------------------------------------------------
linux_display_server wayland
# IME adds input latency on Wayland; reload cannot change this, restart kitty.
wayland_enable_ime no
wayland_titlebar_color system

# --- Shell --------------------------------------------------------------------
shell zsh
env WITH_ZELLIJ=true

# --- Font ---------------------------------------------------------------------
# The Dux terminal face, as in modules/sway/files/alacritty/wm.toml.
font_family      family='RecMonoLinear Nerd Font Mono'
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 14.0

# --- Window -------------------------------------------------------------------
window_padding_width 6 8
background_opacity 0.90
dynamic_background_opacity yes
# Wayland blurs only when the compositor has the background-blur extension.
background_blur 32

# --- Cursor -------------------------------------------------------------------
cursor_shape underline
cursor_underline_thickness 2.0
# Trail only after the cursor rests 3 ms, so TUI redraws do not smear.
cursor_trail 3

# --- Scrollback ---------------------------------------------------------------
scrollback_lines 10000
# Neovim 0.12+ pager, from the kitty docs. q quits.
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -
wheel_scroll_multiplier 5.0

# --- Mouse and selection ------------------------------------------------------
url_style curly
copy_on_select yes
strip_trailing_spaces smart
mouse_map shift+middle release ungrabbed,grabbed paste_selection
mouse_map shift+middle press grabbed discard_event
mouse_map shift+left doublepress ungrabbed,grabbed mouse_selection word
mouse_map right press ungrabbed mouse_selection extend

# --- Layouts and keys ---------------------------------------------------------
# splits for side-by-side windows, stack to zoom one (like tmux prefix z).
enabled_layouts splits,stack
map kitty_mod+enter launch --location=split --cwd=current
map kitty_mod+t     new_tab_with_cwd
map kitty_mod+m     toggle_layout stack

# --- Tab bar ------------------------------------------------------------------
# Same shape as the DMS kitty-tabs template; Zellij's bar sits at the bottom.
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_align           left
tab_bar_min_tabs        2
tab_bar_margin_height   2.5 1.5
tab_activity_symbol     " ● "
active_tab_font_style   bold-italic
inactive_tab_font_style normal
tab_title_template      "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:30]}{title[30:] and '…'} [{index}]"

# --- Colors: Dux --------------------------------------------------------------
foreground           #e6e0e9
background           #141218
selection_foreground #381e72
selection_background #d0bcff
cursor               #d0bcff
cursor_text_color    #381e72
url_color            #d0bcff

active_border_color   #d0bcff
inactive_border_color #49454e
bell_border_color     #f2b8b5

tab_bar_background      #141218
tab_bar_margin_color    #141218
active_tab_foreground   #381e72
active_tab_background   #d0bcff
inactive_tab_foreground #cac4cf
inactive_tab_background #2b292f

mark1_foreground #381e72
mark1_background #d0bcff
mark2_foreground #141218
mark2_background #ccc2dc
mark3_foreground #e6e0e9
mark3_background #4f378b

# normal
color0 #141218
color1 #f2b8b5
color2 #ccc2dc
color3 #cac4cf
color4 #d0bcff
color5 #4f378b
color6 #948f99
color7 #e6e0e9
# bright
color8  #49454e
color9  #f2b8b5
color10 #ccc2dc
color11 #cac4cf
color12 #d0bcff
color13 #ccc2dc
color14 #948f99
color15 #ffffff

# --- DankMaterialShell --------------------------------------------------------
# On a DMS host, matugen writes live wallpaper colors next to this file. They
# load last, so they win. globinclude matches nothing on other hosts, silently.
globinclude dank-theme.conf
globinclude dank-tabs.conf

# vim:ft=kitty
